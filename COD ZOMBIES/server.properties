# Minecraft PS4 Edition server settings. Edit with any text editor, then restart the server.
# Each setting has what it does, what's allowed and its default above it.
# Lines starting with # are notes. "(new world)" settings only count when the world is first made.
# Operators are in ops.txt (next to this file): /op and /deop change it, no restart needed.

# =============== Server ===============

# The name PS4s see in their join list.
# Allowed: any text, up to 16 characters
# Default: Minecraft Server
server-name=COD Zombies

# The port PS4s connect to (Direct Connect). With 3659 they join by the address alone; another port (this one: 3660,
# so it runs beside the main server) they join as address:port - e.g. 192.168.1.10:3660 (new_block 3.65 or newer).
# Allowed: 1 to 65535
# Default: 3659
port=3660

# How many players can be on at once.
# Allowed: 1 to 250
# Default: 16
max-players=250

# How often the world is saved while the server runs.
# Allowed: 0 to 120 (0: only when the server stops)
# Default: 5
autosave-minutes=5

# =============== World ===============

# The world's folders, in worlds/: <world>.0 (GAMEDATA, THUMB) and <world>.1, .2... (its
# regions) - a PS4 save's own layout, so a PS4 save's folders can go there (name them, or
# set this to their name without the .0). No such world: a new one is made. Use a new name to
# start a new world - the old one stays.
# Allowed: letters, numbers, - and _ (no spaces), up to 29 characters
# Default: world
world=world

# The world's name, shown in the join list.
# Allowed: any text, up to 31 characters
# Default: Server World
world-name=COD Zombies

# (new world) The world's seed. Empty: a random one.
# Allowed: a number, any text (up to 63 characters), or nothing
# Default: (nothing)
seed=

# (new world) How big the world is (it ends at its edges). The bigger sizes take more memory: XXXX-Large
# about 270 MB on the server and 150 MB on each PS4 that joins, XXXXX-Large about 1 GB and 600 MB.
# Allowed: Classic (864 x 864 blocks), Small (1,024), Medium (3,072), Large (5,120), X-Large (10,240),
#          XX-Large (16,384), XXX-Large (32,768), XXXX-Large (65,536), XXXXX-Large (131,072)
# Default: Large
world-size=Medium

# (new world) How the world generates (the plugin's World Gen option):
#   Normal - the PS4 game's own world generation
#   Mixed  - the game's terrain with the newer caves, deepslate, ores, geodes and biomes worked in
#   New    - Java's newer terrain (for now it generates the same as Mixed)
# Allowed: Normal, Mixed, New
# Default: Normal
world-gen=Normal

# (new world) The kind of world.
# Allowed: default, superflat (flat land), amplified (huge mountains)
# Default: default
world-type=superflat

# (new world) How big the biomes are.
# Allowed: small, medium, large
# Default: small
biome-scale=small

# (new world) Villages, temples, strongholds and other structures.
# Allowed: true or false
# Default: true
generate-structures=false

# (new world) A chest of starting items near the spawn.
# Allowed: true or false
# Default: false
bonus-chest=false

# =============== Game ===============

# The game mode new players start in.
# Allowed: survival, creative, adventure
# Default: survival
game-mode=survival

# The world's difficulty.
# Allowed: peaceful, easy, normal, hard
# Default: normal
difficulty=normal

# Players can hurt each other.
# Allowed: true or false
# Default: true
pvp=false

# When false, new players can't build, mine or use things until an op trusts them.
# Allowed: true or false
# Default: true
trust-players=true

# Fire spreads to blocks that can burn.
# Allowed: true or false
# Default: true
fire-spreads=false

# Lit TNT explodes.
# Allowed: true or false
# Default: true
tnt-explodes=false

# Mobs spawn by themselves.
# Allowed: true or false
# Default: true
mob-spawning=false

# Creepers, endermen and other mobs can change blocks.
# Allowed: true or false
# Default: true
mob-griefing=false

# Mobs drop items when they die.
# Allowed: true or false
# Default: true
mob-loot=false

# Broken blocks drop items.
# Allowed: true or false
# Default: true
tile-drops=false

# Players keep their items when they die.
# Allowed: true or false
# Default: false
keep-inventory=true

# Health comes back by itself when you're fed.
# Allowed: true or false
# Default: true
natural-regeneration=false

# Day turns to night and back (false: the time stays where it is).
# Allowed: true or false
# Default: true
daylight-cycle=false

# Rain and storms come and go (false: the weather stays as it is).
# Allowed: true or false
# Default: true
weather-cycle=false

# Ops get the PS4's Host Options powers (fly, teleport, time and weather).
# Allowed: true or false
# Default: true
host-privileges=false

# =============== Added by the server (settings this file didn't have) ===============

# The message of the day: what the join menu shows, under the server's version, when a PS4 picks
# this server (PS4s with plugin 2.55 or newer). & or § and then 0-9 or a-f colour what follows,
# as on Java (&6 gold, &c red, &a green...; &r back to white). Symbols show only if the PS4's menu
# font has them: © ® ™ ° • € £ and accented letters do; ⚔ ★ ❤ and arrows don't.
# Allowed: any text, up to 120 characters
# Default: A Minecraft Server
motd=&c&lCOD ZOMBIES &7- survive the rounds with your party


# Which version of the new_block plugin the server runs (new_block 3.65 or newer):
#   backport - every backported block, item, mob and feature (PS4s on the Backport version join)
#   zombies  - just what the COD Zombies server needs on the plain game: its guns, menus, HUD and sounds
#              (PS4s with Settings > User Interface > COD Zombies Version join). Start a new world when
#              changing it - a world's backport blocks are lost without the backport version.
# Allowed: backport, zombies
# Default: backport
game-version=zombies
